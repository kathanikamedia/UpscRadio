{% extends "base.html" %}{% load static %}{% block content %}
<section class="wrap section narrow"><h1>Secure checkout</h1><div class="card"><h3>{{ payment.course }}</h3><p>Amount due ₹{{ payment.rupees }}</p>{% if 'rzp_test_' in key_id %}<p>Razorpay test mode</p>{% endif %}
<form method="post" action="{% url 'verify' payment.receipt %}" id="checkout" data-key="{{ key_id }}" data-order="{{ payment.order_id }}" data-amount="{{ payment.amount }}"><p id="checkout-status" aria-live="polite"></p>{% csrf_token %}<input type="hidden" name="razorpay_payment_id"><input type="hidden" name="razorpay_signature"><button class="button" type="button" id="pay">Pay with Razorpay</button></form></div></section>
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script><script src="{% static 'payments.js' %}" defer></script>
{% endblock %}
